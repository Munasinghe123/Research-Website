<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
    <defs>
        <linearGradient id="ambig-bg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#070c12" />
            <stop offset="100%" stop-color="#030609" />
        </linearGradient>
        <linearGradient id="doc-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0e1722" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#070c13" stop-opacity="0.95" />
        </linearGradient>
        <filter id="ambig-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="400" height="240" rx="14" fill="url(#ambig-bg)" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1"/>

    <!-- Subtle Tech Grid Lines -->
    <path d="M 40 0 L 40 240 M 120 0 L 120 240 M 200 0 L 200 240 M 280 0 L 280 240 M 360 0 L 360 240" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <path d="M 0 60 L 400 60 M 0 120 L 400 120 M 0 180 L 400 180" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

    <!-- Ambient Center Warning Glow -->
    <circle cx="210" cy="115" r="75" fill="#f59e0b" opacity="0.08" filter="url(#ambig-glow)" />

    <!-- Central Document with Gaps & Blurred Specs -->
    <g transform="translate(130, 25)">
        <rect width="140" height="185" rx="12" fill="url(#doc-grad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.2"/>
        
        <!-- Header -->
        <rect x="20" y="22" width="55" height="7" rx="3" fill="#06b6d4"/>
        <line x1="20" y1="38" x2="120" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <!-- Valid Line -->
        <rect x="20" y="48" width="85" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>

        <!-- Missing / Incomplete Requirements Gap (Cutout) -->
        <rect x="20" y="62" width="100" height="26" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="32" y="78" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">[MISSING SPEC ?]</text>

        <!-- Blurred / Ambiguous Lines -->
        <rect x="20" y="100" width="75" height="5" rx="2" fill="rgba(255,255,255,0.18)" filter="url(#ambig-glow)"/>
        <rect x="20" y="112" width="90" height="5" rx="2" fill="rgba(255,255,255,0.18)" filter="url(#ambig-glow)"/>
        <rect x="20" y="124" width="60" height="5" rx="2" fill="rgba(255,255,255,0.18)" filter="url(#ambig-glow)"/>

        <!-- Conflicting Contradiction Marker -->
        <rect x="20" y="142" width="100" height="22" rx="4" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
        <circle cx="32" cy="153" r="5" fill="#ef4444"/>
        <text x="30" y="156" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8" font-weight="700">!</text>
        <rect x="44" y="150" width="65" height="5" rx="2" fill="#f87171"/>
    </g>

    <!-- Floating Conflicting Dialogue Bubbles (Left Side) -->
    <g transform="translate(35, 60)">
        <rect width="80" height="42" rx="8" fill="#0d141f" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#06b6d4"/>
        <rect x="30" y="15" width="38" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
        <rect x="30" y="24" width="24" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
        <!-- Dialogue pointer -->
        <polygon points="70,42 80,48 78,42" fill="#0d141f"/>
    </g>

    <!-- Floating Conflicting Dialogue Bubbles (Right Side) with Ambiguity -->
    <g transform="translate(285, 115)">
        <rect width="80" height="42" rx="8" fill="#140f12" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
        <circle cx="20" cy="20" r="4" fill="#f59e0b"/>
        <rect x="30" y="15" width="38" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
        <rect x="30" y="24" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
        <!-- Dialogue pointer -->
        <polygon points="10,42 0,48 2,42" fill="#140f12"/>
    </g>
</svg>
