<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
    <defs>
        <linearGradient id="frag-bg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#070c12" />
            <stop offset="100%" stop-color="#030609" />
        </linearGradient>
        <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f1923" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#060c13" stop-opacity="0.9" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="400" height="240" rx="14" fill="url(#frag-bg)" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1"/>

    <!-- Subtle Tech Grid Lines -->
    <path d="M 40 0 L 40 240 M 120 0 L 120 240 M 200 0 L 200 240 M 280 0 L 280 240 M 360 0 L 360 240" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    <path d="M 0 60 L 400 60 M 0 120 L 400 120 M 0 180 L 400 180" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

    <!-- Ambient Center Glow -->
    <circle cx="200" cy="120" r="70" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

    <!-- Severed / Fragmented Connection Lines with Warning Breakpoints -->
    <path d="M 105 75 L 145 75" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.5"/>
    <path d="M 145 75 L 165 75" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="152" y1="69" x2="158" y2="81" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="158" y1="69" x2="152" y2="81" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <path d="M 235 75 L 295 75" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="262" y1="69" x2="268" y2="81" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="268" y1="69" x2="262" y2="81" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <path d="M 200 105 L 200 145" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.4"/>
    <line x1="194" y1="122" x2="206" y2="128" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="206" y1="122" x2="194" y2="128" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Isolated Tool Island 1: Requirements (Top Left) -->
    <g transform="translate(35, 45)">
        <rect width="70" height="60" rx="10" fill="url(#card-grad)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2"/>
        <rect x="12" y="14" width="28" height="4" rx="2" fill="#06b6d4"/>
        <rect x="12" y="24" width="46" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
        <rect x="12" y="32" width="38" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
        <rect x="12" y="40" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
        <circle cx="56" cy="16" r="4" fill="#06b6d4" filter="url(#glow)"/>
    </g>

    <!-- Isolated Tool Island 2: Architecture / HLD (Top Center) -->
    <g transform="translate(165, 45)">
        <rect width="70" height="60" rx="10" fill="url(#card-grad)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2"/>
        <circle cx="35" cy="22" r="7" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="22" cy="44" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <circle cx="48" cy="44" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <line x1="31" y1="28" x2="25" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <line x1="39" y1="28" x2="45" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    </g>

    <!-- Isolated Tool Island 3: Low-Level / Data (Top Right) -->
    <g transform="translate(295, 45)">
        <rect width="70" height="60" rx="10" fill="url(#card-grad)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2"/>
        <ellipse cx="35" cy="18" rx="18" ry="6" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
        <path d="M 17 18 v 12 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -12" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
        <path d="M 17 30 v 12 c 0 3.3 8 6 18 6 s 18 -2.7 18 -6 v -12" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Isolated Tool Island 4: UI Prototype (Bottom Center) -->
    <g transform="translate(145, 145)">
        <rect width="110" height="65" rx="10" fill="url(#card-grad)" stroke="rgba(6, 182, 212, 0.45)" stroke-width="1.2"/>
        <rect x="10" y="10" width="90" height="10" rx="3" fill="rgba(6, 182, 212, 0.15)"/>
        <circle cx="16" cy="15" r="2" fill="#ef4444"/>
        <circle cx="23" cy="15" r="2" fill="#eab308"/>
        <circle cx="30" cy="15" r="2" fill="#22c55e"/>
        <rect x="10" y="26" width="38" height="28" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
        <rect x="54" y="26" width="46" height="6" rx="2" fill="#06b6d4" opacity="0.8"/>
        <rect x="54" y="36" width="40" height="4" rx="1.5" fill="rgba(255,255,255,0.3)"/>
        <rect x="54" y="44" width="30" height="4" rx="1.5" fill="rgba(255,255,255,0.3)"/>
    </g>

    <!-- Bottom Warning Badge: Tool Silos -->
    <g transform="translate(35, 180)">
        <rect width="90" height="24" rx="12" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
        <circle cx="47" cy="192" r="3" fill="#ef4444"/>
        <text x="56" y="196" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">TOOL SILOS</text>
    </g>
</svg>
